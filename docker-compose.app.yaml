services:
  backend:
    build:
      context: ./backend
      dockerfile: src/main/docker/Dockerfile.jvm
    image: quarkus-backend
    # The services are started in parallel, so the backend may be faster than the database or Keycloak: simply try again.
    restart: on-failure
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/quarkus
      - QUARKUS_FLYWAY_SCHEMAS=quarkus
      - OLLAMA_HOST=http://ollama:11434
      # The backend reaches Keycloak by its service name, ...
      - QUARKUS_OIDC_AUTH_SERVER_URL=http://keycloak:8080/realms/quarkus
      # ... but the browser (and therefore the issuer in the tokens) uses localhost:8180.
      - QUARKUS_OIDC_TOKEN_ISSUER=http://localhost:8180/realms/quarkus
      - APP_LOGOUT_REDIRECT=http://localhost:8082/
    networks:
      - quarkus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vite-frontend
    ports:
      - "8082:80"
    networks:
      - quarkus-net

networks:
  quarkus-net:
    name: quarkus-net
