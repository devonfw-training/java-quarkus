server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward /api/... to the backend, which serves its REST API under /api (quarkus.rest.path).
    # The backend host name is resolved via a variable on every request (see resolver above), so nginx also starts
    # when the backend container is not yet up.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }
}
