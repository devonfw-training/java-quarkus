# ============================================================================
# General Dev Services
# ============================================================================
# Dev Services are used by the tests only. In dev mode Postgres and Keycloak are not started by Quarkus but come from docker compose:
# docker compose -f docker-compose.db.yaml -f docker-compose.auth.yaml up -d
quarkus.devservices.enabled=true
%dev.quarkus.devservices.enabled=false
%dev.quarkus.observability.enabled=false
# ============================================================================
# Database (PostgreSQL)
# ============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quarkus
quarkus.datasource.password=quarkus
# Dev mode: Postgres of docker compose (docker-compose.db.yaml). Tests: Dev Services. Prod: QUARKUS_DATASOURCE_JDBC_URL
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus
# Hibernate
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.validate-in-dev-mode=true
# Flyway
quarkus.flyway.create-schemas=true
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.schemas=quarkus
# ============================================================================
# Security / OIDC / Keycloak
# ============================================================================
# Dev mode: Keycloak of docker compose (docker-compose.auth.yaml, port 8180).
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/quarkus
# Tests: Keycloak Dev Services on port 8180 (stop the Keycloak container before running the tests) which imports the realm.
%test.quarkus.keycloak.devservices.enabled=true
%test.quarkus.keycloak.devservices.port=8180
%test.quarkus.keycloak.devservices.realm-path=keycloak/quarkus-realm.json
# Backend OIDC configuration: the backend only validates bearer tokens (signature, issuer, expiry) issued by Keycloak.
# quarkus.oidc.auth-server-url is set for dev mode, provided by Dev Services (test) or by QUARKUS_OIDC_AUTH_SERVER_URL (docker compose).
quarkus.oidc.application-type=service
quarkus.oidc.client-id=backend-service
# The realm adds the realm roles of the user as claim "roles" to the access token.
# Each role is named like a permission (see ApplicationAccessControlConfig).
quarkus.oidc.roles.role-claim-path=roles
# Do not fail if Keycloak is still starting (docker compose): keep retrying for up to 60 seconds.
quarkus.oidc.connection-delay=60S
# ============================================================================
# Frontend Integration (logout)
# ============================================================================
# URL of Keycloak as reachable by the browser of the user (not by the backend container).
app.keycloak.public-url=http://localhost:8180/realms/quarkus
app.frontend-client-id=frontend
# Where Keycloak sends the browser after logout (default: the backend that serves the frontend, docker compose overrides it).
app.logout-redirect=${APP_LOGOUT_REDIRECT:http://localhost:8080/}
# ============================================================================
# Quinoa (Frontend)
# ============================================================================
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.build-dir=build
quarkus.quinoa.dev-server.port=5173
# Reloading the page on a route of the frontend (e.g. /1) delivers index.html. The REST API (/api) and /q/... are not affected.
quarkus.quinoa.enable-spa-routing=true
# Frontend commands
quarkus.quinoa.dev-command=start
quarkus.quinoa.build-command=build
# ============================================================================
# HTTP / CORS
# ============================================================================
# The REST API is served under /api, so that it can be told apart from the frontend which is served by the same server (Quinoa).
quarkus.rest.path=/api
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:8080
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, OPTIONS, DELETE
# ============================================================================
# REST Clients
# ============================================================================
# Bored API
quarkus.rest-client.bored-api.url=https://www.boredapi.com/api/
# Ollama
app.services.ollama.model=${OLLAMA_MODEL:llama3.2}
app.services.ollama.keep-alive-time=${OLLAMA_KEEP_ALIVE_TIME:10m}
quarkus.rest-client.ollama_api_yaml.uri=${OLLAMA_HOST:http://localhost:11434}
# Logging
%dev.quarkus.rest-client.logging.scope=request-response
%test.quarkus.rest-client.logging.scope=request-response
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG
# ============================================================================
# OpenAPI
# ============================================================================
quarkus.smallrye-openapi.info-title=Task API
%dev.quarkus.smallrye-openapi.info-title=Task API (development)
%test.quarkus.smallrye-openapi.info-title=Task API (test)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=A service to manage tasks
quarkus.smallrye-openapi.info-contact-name=Task API Support
quarkus.smallrye-openapi.info-contact-email=techsupport@example.com
quarkus.smallrye-openapi.info-contact-url=http://exampleurl.com/contact
quarkus.smallrye-openapi.operation-id-strategy=method
quarkus.smallrye-openapi.store-schema-directory=target/openapi
